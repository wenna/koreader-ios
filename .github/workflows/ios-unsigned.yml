name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "platform/ios/**"
      - "make/ios.mk"
      - ".github/workflows/ios-unsigned.yml"

jobs:
  build-ios:
    name: Build KOReader iOS
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1

          brew install \
            autoconf \
            automake \
            bash \
            binutils \
            cmake \
            coreutils \
            findutils \
            gettext \
            gnu-getopt \
            libtool \
            make \
            meson \
            nasm \
            ninja \
            pkgconf \
            sdl3 \
            util-linux \
            xcodegen

      - name: Setup GNU tools PATH
        run: |
          echo "$(brew --prefix)/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-getopt/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/util-linux/bin" >> "$GITHUB_PATH"

      - name: Check prerequisites
        run: |
          ./platform/ios/check-prereqs.sh

      - name: Generate Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate application
        run: |
          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/KOReader.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "KOReader.app not found"
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          du -sh "$APP_PATH"

      - name: Create unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/KOReader.app

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            KOReader-unsigned.ipa

          ls -lh KOReader-unsigned.ipa

      - name: Verify IPA
        run: |
          unzip -l KOReader-unsigned.ipa | head -50

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: KOReader-iOS-unsigned
          path: KOReader-unsigned.ipa
          retention-days: 30
